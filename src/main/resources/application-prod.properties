# 운영(prod) 설정. --spring.profiles.active=prod 로 활성화한다.
# application.properties 중 아래에 다시 적은 항목만 덮어쓴다.

# --- DataSource (PostgreSQL): 접속 정보는 환경변수로 받는다 ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cleaneye_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA/Hibernate ---
# validate: 엔티티와 테이블 구조가 다르면 기동을 중단한다. 스키마는 자동으로 바꾸지 않는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.mjucapstone.cleaneye=INFO
logging.level.org.hibernate.SQL=WARN

# --- Gemini API ---
# 키가 없으면 기동 시 바로 실패하도록 기본값을 두지 않는다.
gemini.api.key=${GEMINI_API_KEY}

# --- Caching (Caffeine) ---
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m
