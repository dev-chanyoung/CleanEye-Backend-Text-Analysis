spring.application.name=cleaneye_test

# --- Character Encoding ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# --- DataSource (PostgreSQL) ---
# DB ??? 'cleaneye_test'? ?? ?????.
spring.datasource.url=jdbc:postgresql://localhost:5432/cleaneye_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA/Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update: ???(ReportedExpression)? DB ???? ???? ?????.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ??????? ???? ??? ???? ?????.
spring.jpa.properties.hibernate.highlight_sql=true
# ??? ?? ?? ?? ?????? ??? ? ??? ????? ?????.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.mjucapstone.cleaneye=INFO
# ?? ????(?? ??? ?????)? ?? ??? ?? ??? ?????.
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Gemini API ---
gemini.api.key=${GEMINI_API_KEY:API_KEY_NOT_FOUND}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

# --- Caching (Caffeine) ---
spring.cache.cache-names=geminiResults,refinedTextResults
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m