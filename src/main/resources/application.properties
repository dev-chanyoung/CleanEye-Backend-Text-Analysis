spring.application.name=cleaneye_test

# --- Character Encoding ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# --- DataSource (PostgreSQL) ---
# 로컬 PostgreSQL의 'cleaneye_db' DB에 연결합니다. (DB는 미리 만들어 둬야 합니다)
spring.datasource.url=jdbc:postgresql://localhost:5432/cleaneye_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA/Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update: 엔티티(ReportedExpression)에 맞춰 DB 스키마를 자동 갱신합니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 콘솔에 출력되는 SQL에 문법 강조를 적용합니다.
spring.jpa.properties.hibernate.highlight_sql=true
# 기동 시 JDBC 메타데이터 조회를 건너뛰어 불필요한 DB 접속 경고를 줄입니다.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.mjucapstone.cleaneye=INFO
# SQL 바인딩 파라미터 값까지 확인하려면 아래 주석을 해제합니다.
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Gemini API ---
gemini.api.key=${GEMINI_API_KEY:API_KEY_NOT_FOUND}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

# --- Caching (Caffeine) ---
spring.cache.cache-names=geminiResults,refinedTextResults
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m